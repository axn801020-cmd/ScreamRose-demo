<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScreamRose | 後台管理</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #0a0a0a; color: #f1f1f1; font-family: sans-serif; margin: 0; }
    .admin-wrap { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

    /* 頁面標題 */
    h1 { font-size: 28px; letter-spacing: 3px; margin-bottom: 32px; border-bottom: 1px solid #222; padding-bottom: 16px; }

    /* 分頁標籤列 */
    .tab-bar { display: flex; gap: 0; margin-bottom: 0; border-bottom: 1px solid #222; }
    .tab { padding: 12px 28px; cursor: pointer; color: #555; font-size: 14px; letter-spacing: 1px; border-bottom: 2px solid transparent; transition: color 0.2s; }
    .tab.active { color: #fff; border-bottom: 2px solid #b30000; }
    .tab-content { display: none; padding-top: 28px; }
    .tab-content.active { display: block; }

    /* ── 工具列：搜尋 + 新增按鈕 ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    .search-group {
      display: flex;
      gap: 10px;
      flex: 1;
    }
    .search-group input, .search-group select {
      background: #111;
      border: 1px solid #2a2a2a;
      color: #f1f1f1;
      padding: 9px 14px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-group input { flex: 1; }
    .search-group input:focus, .search-group select:focus { border-color: #b30000; }
    .search-group select option { background: #111; }

    /* 新增商品按鈕（跳頁） */
    .btn-add {
      padding: 9px 22px;
      background: #b30000;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      letter-spacing: 1px;
      white-space: nowrap;
      text-decoration: none;
      display: inline-block;
      transition: background 0.2s;
    }
    .btn-add:hover { background: #cc0000; }

    /* ── 商品列表 ── */
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th {
      text-align: left; padding: 10px 12px;
      border-bottom: 1px solid #222; color: #555;
      font-weight: normal; font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
    }
    td { padding: 12px; border-bottom: 1px solid #1a1a1a; vertical-align: middle; }
    td img { width: 54px; height: 54px; object-fit: cover; border-radius: 6px; border: 1px solid #222; }
    tbody tr:hover { background: #111; }

    /* 操作按鈕 */
    .btn-del {
      background: transparent; border: 1px solid #b30000; color: #b30000;
      padding: 5px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: all 0.2s;
    }
    .btn-del:hover { background: #b30000; color: #fff; }
    .btn-edit {
      background: transparent; border: 1px solid #c9a44c; color: #c9a44c;
      padding: 5px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 6px; transition: all 0.2s;
    }
    .btn-edit:hover { background: #c9a44c; color: #000; }

    /* 訂單表格 */
    .order-table td { font-size: 13px; }
    .badge { padding: 3px 10px; border-radius: 99px; font-size: 12px; }
    .badge-pending { background: #2a2000; color: #c9a44c; }
    .badge-done { background: #002a00; color: #4caf50; }

    /* 統計數字 */
    .stats-row {
      display: flex; gap: 16px; margin-bottom: 20px;
    }
    .stat-box {
      background: #111; border: 1px solid #1e1e1e; border-radius: 8px;
      padding: 14px 20px; min-width: 120px;
    }
    .stat-box .stat-label { font-size: 11px; color: #555; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
    .stat-box .stat-value { font-size: 22px; color: #fff; font-weight: 600; }

    /* 空列表提示 */
    .empty-hint { text-align: center; padding: 60px 0; color: #333; font-size: 14px; }

    /* 編輯 Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; align-items: center; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal { background: #111; border: 1px solid #2a2a2a; border-radius: 12px; padding: 32px; width: 520px; max-width: 95vw; }
    .modal h3 { margin: 0 0 24px; font-size: 16px; letter-spacing: 2px; border-bottom: 1px solid #222; padding-bottom: 14px; }
    .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-grid input { grid-column: span 1; }
    .modal-grid .full { grid-column: span 2; }
    .modal input, .modal textarea {
      width: 100%; box-sizing: border-box; background: #0a0a0a;
      border: 1px solid #2a2a2a; color: #f1f1f1; padding: 10px 14px;
      border-radius: 6px; font-size: 14px;
    }
    .modal input:focus, .modal textarea:focus { outline: none; border-color: #b30000; }
    .modal-btns { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
    .btn-cancel { padding: 8px 20px; background: transparent; border: 1px solid #333; color: #aaa; border-radius: 6px; cursor: pointer; }
    .btn-save { padding: 8px 24px; background: #b30000; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    .btn-save:hover { background: #cc0000; }

    /* 圖片上傳列 */
    .upload-row { display: flex; gap: 8px; align-items: center; grid-column: span 2; }
    .upload-row input[type="text"] { flex: 1; }
    .upload-label { padding: 10px 16px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 6px; cursor: pointer; font-size: 13px; color: #aaa; white-space: nowrap; }
    .upload-label:hover { border-color: #555; color: #fff; }
    .upload-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; display: none; border: 1px solid #2a2a2a; }
    .uploading { font-size: 12px; color: #c9a44c; }
  </style>
</head>
<body>

<header class="top-bar">
  <a href="index.html" class="brand" style="text-decoration:none;color:inherit;">ScreamRose</a>
  <nav>
    <a href="guitars.html">Guitars</a>
    <a href="artists.html">Artists</a>
    <a href="support.html">Support</a>
  </nav>
  <div class="cart">
    <span id="auth-area"></span>
  </div>
</header>

<div class="admin-wrap">
	
	<div class="admin-wrap">

	  <!-- ── 法律警告橫幅 ── -->
	  <div style="
	    background: #1a0000;
	    border: 1px solid #b30000;
	    border-radius: 8px;
	    padding: 12px 20px;
	    margin-bottom: 24px;
	    font-size: 13px;
	    color: #ff6666;
	    letter-spacing: 0.5px;
	    display: flex;
	    align-items: center;
	    gap: 10px;
	  ">
	    ⚠ 警告：本系統為 ScreamRose 內部管理平台，僅限授權人員使用。未經授權存取或任何非法操作，將依法追究相關法律責任。
	  </div>

	 
	
  <h1>⚙ 後台管理</h1>

  <div class="tab-bar">
    <div class="tab active" data-tab="products" onclick="switchTab(this, 'products')">商品管理</div>
    <div class="tab" data-tab="orders" onclick="switchTab(this, 'orders')">訂單管理</div>
  </div>

  <!-- ════ 商品管理 分頁 ════ -->
  <div class="tab-content active" id="tab-products">

    <!-- 統計列 -->
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-label">商品總數</div>
        <div class="stat-value" id="stat-product-count">–</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">總庫存</div>
        <div class="stat-value" id="stat-stock-total">–</div>
      </div>
    </div>

    <!-- 工具列：搜尋 + 新增按鈕 -->
    <div class="toolbar">
      <div class="search-group">
        <!-- 關鍵字搜尋 -->
        <input id="search-keyword" placeholder="🔍 搜尋商品名稱或顏色…" oninput="filterProducts()" />
        <!-- 系列篩選 -->
        <select id="filter-series" onchange="filterProducts()">
          <option value="">全部系列</option>
          
        </select>
      </div>
      <!-- 點此跳到獨立新增頁面 -->
      <a href="admin-add.html" class="btn-add">＋ 新增商品</a>
    </div>

    <!-- 商品列表 -->
    <table>
      <thead>
        <tr>
          <th>圖片</th>
          <th>名稱</th>
          <th>顏色</th>
          <th>系列</th>
          <th>價格</th>
          <th>庫存</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="product-tbody">
        <tr><td colspan="7" class="empty-hint">載入中…</td></tr>
      </tbody>
    </table>
  </div>

  <!-- ════ 訂單管理 分頁 ════ -->
  <div class="tab-content" id="tab-orders">

    <!-- 工具列 -->
    <div class="toolbar">
      <div class="search-group">
        <input id="order-search" placeholder="🔍 搜尋訂單 ID 或用戶…" oninput="filterOrders()" />
      </div>
    </div>

    <table class="order-table">
      <thead>
        <tr>
          <th>訂單 ID</th>
          <th>用戶</th>
          <th>商品</th>
          <th>數量</th>
          <th>金額</th>
          <th>狀態</th>
          <th>時間</th>
        </tr>
      </thead>
      <tbody id="order-tbody">
        <tr><td colspan="7" class="empty-hint">點選「訂單管理」後載入…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ════ 編輯商品 Modal ════ -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3>✏ 編輯商品</h3>
    <div class="modal-grid">
      <input id="e-name"   placeholder="商品名稱" />
      <input id="e-price"  placeholder="價格" type="number" />
      <input id="e-series" placeholder="系列" />
      <input id="e-color"  placeholder="顏色" />
      <input id="e-stock"  placeholder="庫存" type="number" />
      <input id="e-desc"   placeholder="描述" />

      <!-- 圖片上傳 -->
      <div class="upload-row full">
        <input type="text" id="e-image" placeholder="圖片路徑" readonly />
        <label class="upload-label">
          📁 換圖
          <input type="file" accept="image/*" style="display:none;"
                 onchange="uploadImage(this, 'e-image', 'e-preview', 'e-uploading')" />
        </label>
        <img id="e-preview" class="upload-preview" />
      </div>
      <span id="e-uploading" class="uploading full" style="display:none;">上傳中…</span>
    </div>

    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save"   onclick="saveEdit()">儲存變更</button>
    </div>
  </div>
</div>

<script src="header.js" defer></script>
<script>
  /* ── JWT 驗證，非 ADMIN 踢出 ── */
  const token = localStorage.getItem("token");
  const role  = localStorage.getItem("role");
  if (!token || role !== "ADMIN") {
    alert("⚠ 請先以 ADMIN 身份登入！");
    location.href = "login.html";
  }

  const API = "";
  let editingId  = null;
  let allProducts = [];  // 快取商品清單，供前端篩選用
  let allOrders   = [];  // 快取訂單清單

  /* ════ 分頁切換 ════ */
  function switchTab(el, name) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
    el.classList.add("active");
    document.getElementById("tab-" + name).classList.add("active");
    if (name === "orders") loadOrders();
  }

  /* ════ 商品列表 ════ */
  function loadProducts() {
    fetch(API + "/api/products")
      .then(r => r.json())
      .then(list => {
        allProducts = list;
        renderProducts(list);

        // 更新統計
        document.getElementById("stat-product-count").textContent = list.length;
        const total = list.reduce((s, p) => s + (p.stock || 0), 0);
        document.getElementById("stat-stock-total").textContent = total;
      });
  }

  /* 渲染商品表格列 */
  function renderProducts(list) {
    const tbody = document.getElementById("product-tbody");
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty-hint">目前沒有商品</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(p => `
      <tr>
        <td><img src="${p.image || ''}" onerror="this.src=''" /></td>
        <td>${p.name}</td>
        <td>${p.color || "–"}</td>
        <td><span style="color:#888;font-size:12px;">${p.series || "–"}</span></td>
        <td>NT$ ${Number(p.price).toLocaleString()}</td>
        <td>${p.stock}</td>
        <td>
          <button class="btn-edit" onclick="openEdit(${p.id})">編輯</button>
          <button class="btn-del"  onclick="deleteProduct(${p.id})">刪除</button>
        </td>
      </tr>
    `).join("");
  }

  /* 前端篩選（關鍵字 + 系列） */
  function filterProducts() {
    const kw     = document.getElementById("search-keyword").value.toLowerCase();
    const series = document.getElementById("filter-series").value;
    const filtered = allProducts.filter(p => {
      const matchKw     = !kw || p.name.toLowerCase().includes(kw) || (p.color || "").toLowerCase().includes(kw);
      const matchSeries = !series || p.series === series;
      return matchKw && matchSeries;
    });
    renderProducts(filtered);
  }

  /* ════ 刪除商品 ════ */
  function deleteProduct(id) {
    if (!confirm("確定要刪除這個商品嗎？")) return;
    fetch(API + "/api/admin/products/" + id, {
      method: "DELETE",
      headers: { "Authorization": "Bearer " + token }
    }).then(() => loadProducts());
  }

  /* ════ 編輯 Modal ════ */
  function openEdit(id) {
    fetch(API + "/api/products/" + id)
      .then(r => r.json())
      .then(p => {
        editingId = id;
        document.getElementById("e-name").value   = p.name;
        document.getElementById("e-price").value  = p.price;
        document.getElementById("e-series").value = p.series  || "";
        document.getElementById("e-color").value  = p.color   || "";
        document.getElementById("e-image").value  = p.image   || "";
        document.getElementById("e-stock").value  = p.stock;
        document.getElementById("e-desc").value   = p.description || "";
        const prev = document.getElementById("e-preview");
        if (p.image) { prev.src = "/" + p.image; prev.style.display = "block"; }
        else { prev.style.display = "none"; }
        document.getElementById("edit-modal").classList.add("show");
      });
  }

  function closeModal() {
    document.getElementById("edit-modal").classList.remove("show");
  }

  /* 儲存編輯 */
  function saveEdit() {
    const body = {
      name:        document.getElementById("e-name").value,
      price:       document.getElementById("e-price").value,
      series:      document.getElementById("e-series").value,
      color:       document.getElementById("e-color").value,
      image:       document.getElementById("e-image").value,
      stock:       document.getElementById("e-stock").value,
      description: document.getElementById("e-desc").value
    };
    fetch(API + "/api/admin/products/" + editingId, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify(body)
    }).then(() => { closeModal(); loadProducts(); });
  }

  /* ════ 圖片上傳（給編輯 Modal 用） ════ */
  function uploadImage(input, imageFieldId, previewId, loadingId) {
    const file = input.files[0];
    if (!file) return;
    const loading = document.getElementById(loadingId);
    loading.style.display = "inline";
    const formData = new FormData();
    formData.append("file", file);
    fetch(API + "/api/admin/upload", {
      method: "POST",
      headers: { "Authorization": "Bearer " + token },
      body: formData
    })
    .then(r => r.json())
    .then(data => {
      loading.style.display = "none";
      if (data.error) { alert("上傳失敗：" + data.error); return; }
      document.getElementById(imageFieldId).value = data.imageUrl;
      const preview = document.getElementById(previewId);
      preview.src = "/" + data.imageUrl;
      preview.style.display = "block";
    })
    .catch(err => {
      loading.style.display = "none";
      alert("上傳失敗：" + err);
    });
  }

  /* ════ 訂單管理 ════ */
  function loadOrders() {
    fetch(API + "/api/orders/all", {
      headers: { "Authorization": "Bearer " + token }
    })
    .then(r => r.json())
    .then(list => {
      allOrders = list;
      renderOrders(list);
    });
  }

  function renderOrders(list) {
    const tbody = document.getElementById("order-tbody");
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty-hint">目前沒有訂單</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(o => `
      <tr>
        <td>#${o.id}</td>
        <td>${o.user ? o.user.email : "–"}</td>
        <td>${o.productName || "–"}</td>
        <td>${o.quantity}</td>
        <td>NT$ ${o.price ? Number(o.price).toLocaleString() : "–"}</td>
        <td><span class="badge badge-pending">待處理</span></td>
        <td>${o.createdAt ? o.createdAt.substring(0,10) : "–"}</td>
      </tr>
    `).join("");
  }

  /* 前端篩選訂單 */
  function filterOrders() {
    const kw = document.getElementById("order-search").value.toLowerCase();
    const filtered = allOrders.filter(o =>
      String(o.id).includes(kw) ||
      (o.user && o.user.email.toLowerCase().includes(kw)) ||
      (o.productName || "").toLowerCase().includes(kw)
    );
    renderOrders(filtered);
  }
  // 動態載入系列篩選選單
  function loadSeriesFilter() {
    fetch(API + "/api/products/series")
      .then(r => r.json())
      .then(list => {
        const select = document.getElementById("filter-series");
        list.forEach(series => {
          const opt = document.createElement("option");
          opt.value = series;
          opt.textContent = series;
          select.appendChild(opt);
        });
      });
  }
  /* ── 初始載入 ── */
  loadProducts();
  loadSeriesFilter();
</script>
</body>
</html>
