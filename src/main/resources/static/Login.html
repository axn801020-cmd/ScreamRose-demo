<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScreamRose | 登入</title>
  <link rel="stylesheet" href="style.css">
  <script src="header.js" defer></script>
  <style>
    .auth-container {
      max-width: 440px;
      margin: 80px auto;
      padding: 0 20px;
    }
    .auth-box {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 40px;
    }
    .auth-logo {
      text-align: center;
      font-size: 22px;
      letter-spacing: 3px;
      color: #f1f1f1;
      margin-bottom: 8px;
    }
    .auth-subtitle {
      text-align: center;
      font-size: 13px;
      color: #555;
      margin-bottom: 36px;
    }
    .auth-group {
      margin-bottom: 20px;
    }
    .auth-group label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 8px;
    }
    .auth-group input {
      width: 100%;
      padding: 12px 16px;
      background: #111;
      border: 1px solid #333;
      color: #f1f1f1;
      font-size: 15px;
      border-radius: 6px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .auth-group input:focus {
      border-color: #c9a44c;
    }
    .auth-group input::placeholder {
      color: #444;
    }
    .auth-btn {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      font-size: 15px;
      background: #b30000;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s;
    }
    .auth-btn:hover { background: #ff1a1a; }
    .auth-divider {
      text-align: center;
      color: #444;
      font-size: 13px;
      margin: 24px 0;
      position: relative;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 42%;
      height: 1px;
      background: #2a2a2a;
    }
    .auth-divider::before { left: 0; }
    .auth-divider::after { right: 0; }
    .auth-link {
      text-align: center;
      font-size: 14px;
      color: #666;
    }
    .auth-link a {
      color: #c9a44c;
      text-decoration: none;
    }
    .auth-link a:hover { text-decoration: underline; }
    .error-msg {
      background: #2a0000;
      border: 1px solid #5a0000;
      color: #ff6b6b;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>

<header class="top-bar">
  <a href="index.html" class="brand" style="text-decoration:none; color:inherit;">ScreamRose</a>
  <nav>
    <a href="index.html">← 回到首頁</a>
  </nav>
  <div class="cart">
	<span id="auth-area"></span>
	 &nbsp;&nbsp;🛒 <span id="cart-count">0</span>
  </div>
</header>

<div class="auth-container">
  <div class="auth-box">
    <p class="auth-logo">ScreamRose</p>
    <p class="auth-subtitle">會員登入</p>

    <div class="error-msg" id="error-msg"></div>

    <div class="auth-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="請輸入 Email">
    </div>

    <div class="auth-group">
      <label for="password">密碼</label>
      <input type="password" id="password" placeholder="請輸入密碼">
    </div>

    <button class="auth-btn" onclick="handleLogin()">登入</button>

    <div class="auth-divider">或</div>

    <div class="auth-link">
      還沒有帳號？<a href="register.html">立即註冊</a>
    </div>
  </div>
</div>

<script>
  // 更新購物車數量
  const cart = JSON.parse(localStorage.getItem("cart")) || [];
  document.getElementById("cart-count").textContent = cart.reduce((s, i) => s + (i.qty || 0), 0);

  function handleLogin() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const errorEl = document.getElementById("error-msg");

    errorEl.style.display = "none";

    if (!email || !password) {
      errorEl.textContent = "請填寫完整的登入資訊！";
      errorEl.style.display = "block";
      return;
    }

    // 之後接 Spring Boot API：POST /api/login
    // 目前模擬登入成功
	fetch("/api/login", {
	  method: "POST",
	  headers: { "Content-Type": "application/json" },
	  body: JSON.stringify({ email, password })
	})
	.then(async res => {
		const data = await res.json();
		if (res.ok) {
		  localStorage.setItem("token", data.token);
		  localStorage.setItem("role", data.role);
		  localStorage.setItem("member", JSON.stringify({ email, name: email.split("@")[0] }));
		  if (data.role === "ADMIN") {
		    window.location.href = "admin.html";
		  } else {
		    window.location.href = "member.html";
		  }
		} else {
		  errorEl.textContent = data || "Email 或密碼錯誤，請重新確認。";
		  errorEl.style.display = "block";
		}
	})
	.catch(() => {
	  errorEl.textContent = "連線失敗，請確認後端是否啟動。";
	  errorEl.style.display = "block";
	});
   
  }

  // 按 Enter 觸發登入
  document.addEventListener("keydown", function(e) {
    if (e.key === "Enter") handleLogin();
  });
</script>

</body>
</html>
