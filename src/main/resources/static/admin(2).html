<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScreamRose | 後台管理</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #0a0a0a; color: #f1f1f1; font-family: sans-serif; margin: 0; }
    .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
    h1 { font-size: 28px; letter-spacing: 3px; margin-bottom: 40px; border-bottom: 1px solid #222; padding-bottom: 16px; }
    h2 { font-size: 18px; color: #aaa; letter-spacing: 2px; margin: 40px 0 16px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-grid input, .form-grid textarea {
      background: #111; border: 1px solid #2a2a2a; color: #f1f1f1;
      padding: 10px 14px; border-radius: 6px; font-size: 14px; width: 100%; box-sizing: border-box;
    }
    .form-grid textarea { grid-column: span 2; height: 80px; resize: vertical; }
    .form-grid input:focus, .form-grid textarea:focus { outline: none; border-color: #b30000; }
    .btn-submit {
      margin-top: 12px; padding: 10px 28px; background: #b30000;
      color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    .btn-submit:hover { background: #cc0000; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; padding: 10px 12px; border-bottom: 1px solid #222; color: #555; font-weight: normal; }
    td { padding: 10px 12px; border-bottom: 1px solid #1a1a1a; vertical-align: middle; }
    td img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
    .btn-del { background: transparent; border: 1px solid #b30000; color: #b30000; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-del:hover { background: #b30000; color: #fff; }
    .btn-edit { background: transparent; border: 1px solid #c9a44c; color: #c9a44c; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 6px; }
    .btn-edit:hover { background: #c9a44c; color: #000; }
    .order-table td { font-size: 13px; }
    .badge { padding: 3px 10px; border-radius: 99px; font-size: 12px; }
    .badge-pending { background: #2a2000; color: #c9a44c; }
    .badge-done { background: #002a00; color: #4caf50; }
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:999; align-items:center; justify-content:center; }
    .modal-overlay.show { display:flex; }
    .modal { background:#111; border:1px solid #2a2a2a; border-radius:12px; padding:32px; width:480px; }
    .modal h3 { margin:0 0 20px; font-size:16px; letter-spacing:2px; }
    .modal input { width:100%; box-sizing:border-box; background:#0a0a0a; border:1px solid #2a2a2a; color:#f1f1f1; padding:10px 14px; border-radius:6px; font-size:14px; margin-bottom:10px; }
    .modal input:focus { outline:none; border-color:#b30000; }
    .modal-btns { display:flex; gap:10px; margin-top:16px; justify-content:flex-end; }
    .btn-cancel { padding:8px 20px; background:transparent; border:1px solid #333; color:#aaa; border-radius:6px; cursor:pointer; }
    .btn-save { padding:8px 20px; background:#b30000; color:#fff; border:none; border-radius:6px; cursor:pointer; }
    .msg { margin-top: 10px; font-size: 13px; color: #4caf50; }
    .tab-bar { display:flex; gap:0; margin-bottom:0; border-bottom:1px solid #222; }
    .tab { padding:12px 28px; cursor:pointer; color:#555; font-size:14px; letter-spacing:1px; border-bottom:2px solid transparent; }
    .tab.active { color:#fff; border-bottom:2px solid #b30000; }
    .tab-content { display:none; }
    .tab-content.active { display:block; }
    .upload-row { grid-column: span 2; display:flex; gap:8px; align-items:center; }
    .upload-row input[type="text"] { flex:1; background:#111; border:1px solid #2a2a2a; color:#f1f1f1; padding:10px 14px; border-radius:6px; font-size:14px; box-sizing:border-box; }
    .upload-label { padding:10px 16px; background:#1a1a1a; border:1px solid #2a2a2a; border-radius:6px; cursor:pointer; font-size:13px; color:#aaa; white-space:nowrap; }
    .upload-label:hover { border-color:#555; color:#fff; }
    .upload-preview { width:50px; height:50px; object-fit:cover; border-radius:4px; display:none; border:1px solid #2a2a2a; }
    .uploading { font-size:12px; color:#c9a44c; }
  </style>
</head>
<body>

<header class="top-bar">
  <a href="index.html" class="brand" style="text-decoration:none;color:inherit;">ScreamRose</a>
  <nav>
    <a href="guitars.html">Guitars</a>
    <a href="artists.html">Artists</a>
    <a href="support.html">Support</a>
  </nav>
  <div class="cart">
    <span id="auth-area"></span>
  </div>
</header>

<div class="admin-wrap">
  <h1>⚙ 後台管理</h1>

  <div class="tab-bar">
    <div class="tab active" onclick="switchTab('products')">商品管理</div>
    <div class="tab" onclick="switchTab('orders')">訂單管理</div>
  </div>

  <div class="tab-content active" id="tab-products">
    <h2>新增商品</h2>
    <div class="form-grid">
      <input id="f-name" placeholder="商品名稱" />
      <input id="f-price" placeholder="價格（數字）" type="number" />
      <input id="f-series" placeholder="系列（例：Vintage Collection）" />
      <input id="f-color" placeholder="顏色（例：Ebony Black）" />

      <div class="upload-row">
        <input type="text" id="f-image" placeholder="圖片路徑（上傳後自動填入）" readonly />
        <label class="upload-label">
          📁 選擇圖片
          <input type="file" accept="image/*" style="display:none;"
                 onchange="uploadImage(this, 'f-image', 'f-preview', 'f-uploading')" />
        </label>
        <img id="f-preview" class="upload-preview" />
      </div>
      <input id="f-stock" placeholder="庫存數量" type="number" />

      <span id="f-uploading" class="uploading" style="display:none;">上傳中...</span>
      <textarea id="f-desc" placeholder="商品描述"></textarea>
    </div>
    <button class="btn-submit" onclick="createProduct()">＋ 新增商品</button>
    <p class="msg" id="form-msg"></p>

    <h2>商品列表</h2>
    <table>
      <thead>
        <tr><th>圖片</th><th>名稱</th><th>顏色</th><th>價格</th><th>庫存</th><th>操作</th></tr>
      </thead>
      <tbody id="product-tbody"></tbody>
    </table>
  </div>

  <div class="tab-content" id="tab-orders">
    <h2>所有訂單</h2>
    <table class="order-table">
      <thead>
        <tr><th>訂單ID</th><th>用戶</th><th>商品</th><th>數量</th><th>金額</th><th>狀態</th><th>時間</th></tr>
      </thead>
      <tbody id="order-tbody"></tbody>
    </table>
  </div>
</div>

<!-- 編輯 Modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3>編輯商品</h3>
    <input id="e-name" placeholder="商品名稱" />
    <input id="e-price" placeholder="價格" type="number" />
    <input id="e-series" placeholder="系列" />
    <input id="e-color" placeholder="顏色" />
    <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px;">
      <input type="text" id="e-image" placeholder="圖片路徑" readonly
             style="flex:1; margin-bottom:0; background:#0a0a0a; border:1px solid #2a2a2a; color:#f1f1f1; padding:10px 14px; border-radius:6px; font-size:14px;" />
      <label class="upload-label">
        📁 換圖
        <input type="file" accept="image/*" style="display:none;"
               onchange="uploadImage(this, 'e-image', 'e-preview', 'e-uploading')" />
      </label>
      <img id="e-preview" class="upload-preview" />
    </div>
    <span id="e-uploading" class="uploading" style="display:none;">上傳中...</span>
    <input id="e-stock" placeholder="庫存" type="number" />
    <input id="e-desc" placeholder="描述" />
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" onclick="saveEdit()">儲存</button>
    </div>
  </div>
</div>

<script src="header.js" defer></script>
<script>
  const token = localStorage.getItem("token");
  const role  = localStorage.getItem("role");
  if (!token || role !== "ADMIN") {
    alert("請先以 ADMIN 身份登入！");
    location.href = "Login.html";
  }

  const API = "";
  let editingId = null;

  function switchTab(name) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
    document.getElementById("tab-" + name).classList.add("active");
    event.target.classList.add("active");
    if (name === "orders") loadOrders();
  }

  // ===== 上傳圖片 =====
  function uploadImage(input, imageFieldId, previewId, loadingId) {
    const file = input.files[0];
    if (!file) return;

    const loading = document.getElementById(loadingId);
    loading.style.display = "inline";

    const formData = new FormData();
    formData.append("file", file);

    fetch(API + "/api/admin/upload", {
      method: "POST",
      headers: { "Authorization": "Bearer " + token },
      body: formData
    })
    .then(r => r.json())
    .then(data => {
      loading.style.display = "none";
      if (data.error) { alert("上傳失敗：" + data.error); return; }
      document.getElementById(imageFieldId).value = data.imageUrl;
      const preview = document.getElementById(previewId);
      preview.src = "/" + data.imageUrl;
      preview.style.display = "block";
    })
    .catch(err => {
      loading.style.display = "none";
      alert("上傳失敗：" + err);
    });
  }

  // 載入商品
  function loadProducts() {
    fetch(API + "/api/products")
      .then(r => r.json())
      .then(list => {
        document.getElementById("product-tbody").innerHTML = list.map(p => `
          <tr>
            <td><img src="${p.image ? '/' + p.image : ''}" onerror="this.src=''" /></td>
            <td>${p.name}</td>
            <td>${p.color || "-"}</td>
            <td>NT$ ${Number(p.price).toLocaleString()}</td>
            <td>${p.stock}</td>
            <td>
              <button class="btn-edit" onclick="openEdit(${p.id})">編輯</button>
              <button class="btn-del" onclick="deleteProduct(${p.id})">刪除</button>
            </td>
          </tr>
        `).join("");
      });
  }

  // 新增商品
  function createProduct() {
    const image = document.getElementById("f-image").value;
    if (!image) { alert("請先上傳商品圖片！"); return; }

    const body = {
      name:        document.getElementById("f-name").value,
      price:       document.getElementById("f-price").value,
      series:      document.getElementById("f-series").value,
      color:       document.getElementById("f-color").value,
      image:       image,
      stock:       document.getElementById("f-stock").value,
      description: document.getElementById("f-desc").value
    };
    fetch(API + "/api/admin/products", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify(body)
    })
    .then(r => r.text())
    .then(msg => {
      document.getElementById("form-msg").textContent = "✅ " + msg;
      loadProducts();
    });
  }

  // 刪除商品
  function deleteProduct(id) {
    if (!confirm("確定刪除？")) return;
    fetch(API + "/api/admin/products/" + id, {
      method: "DELETE",
      headers: { "Authorization": "Bearer " + token }
    }).then(() => loadProducts());
  }

  // 開編輯 Modal
  function openEdit(id) {
    fetch(API + "/api/products/" + id)
      .then(r => r.json())
      .then(p => {
        editingId = id;
        document.getElementById("e-name").value   = p.name;
        document.getElementById("e-price").value  = p.price;
        document.getElementById("e-series").value = p.series || "";
        document.getElementById("e-color").value  = p.color || "";
        document.getElementById("e-image").value  = p.image || "";
        document.getElementById("e-stock").value  = p.stock;
        document.getElementById("e-desc").value   = p.description || "";
        const prev = document.getElementById("e-preview");
        if (p.image) { prev.src = "/" + p.image; prev.style.display = "block"; }
        else { prev.style.display = "none"; }
        document.getElementById("edit-modal").classList.add("show");
      });
  }

  function closeModal() {
    document.getElementById("edit-modal").classList.remove("show");
  }

  // 儲存編輯
  function saveEdit() {
    const body = {
      name:        document.getElementById("e-name").value,
      price:       document.getElementById("e-price").value,
      series:      document.getElementById("e-series").value,
      color:       document.getElementById("e-color").value,
      image:       document.getElementById("e-image").value,
      stock:       document.getElementById("e-stock").value,
      description: document.getElementById("e-desc").value
    };
    fetch(API + "/api/admin/products/" + editingId, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify(body)
    }).then(() => { closeModal(); loadProducts(); });
  }

  // 載入訂單
  function loadOrders() {
    fetch(API + "/api/orders/all", {
      headers: { "Authorization": "Bearer " + token }
    }).then(r => r.json()).then(list => {
      document.getElementById("order-tbody").innerHTML = list.map(o => `
        <tr>
          <td>#${o.id}</td>
          <td>${o.user ? o.user.email : "-"}</td>
          <td>${o.productName || "-"}</td>
          <td>${o.quantity}</td>
          <td>NT$ ${o.price ? Number(o.price).toLocaleString() : "-"}</td>
          <td><span class="badge badge-pending">待處理</span></td>
          <td>${o.createdAt ? o.createdAt.substring(0,10) : "-"}</td>
        </tr>
      `).join("");
    });
  }

  loadProducts();
</script>
</body>
</html>
