<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScreamRose | 編輯商品</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #0a0a0a; color: #f1f1f1; font-family: sans-serif; margin: 0; }
    .add-wrap { max-width: 780px; margin: 0 auto; padding: 48px 24px 80px; }
    .breadcrumb { font-size: 13px; color: #444; margin-bottom: 28px; display: flex; align-items: center; gap: 8px; }
    .breadcrumb a { color: #666; text-decoration: none; }
    .breadcrumb a:hover { color: #f1f1f1; }
    .breadcrumb span { color: #b30000; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 36px; padding-bottom: 20px; border-bottom: 1px solid #1e1e1e; }
    .page-header h1 { font-size: 24px; letter-spacing: 3px; margin: 0; }
    .btn-back { padding: 8px 20px; background: transparent; border: 1px solid #333; color: #888; border-radius: 6px; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .btn-back:hover { border-color: #555; color: #f1f1f1; }
    .form-card { background: #0e0e0e; border: 1px solid #1e1e1e; border-radius: 12px; padding: 32px; margin-bottom: 20px; }
    .form-card h2 { font-size: 13px; color: #555; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 20px; padding-bottom: 12px; border-bottom: 1px solid #1a1a1a; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-grid .full { grid-column: span 2; }
    .form-grid input, .form-grid textarea { background: #111; border: 1px solid #252525; color: #f1f1f1; padding: 11px 14px; border-radius: 7px; font-size: 14px; width: 100%; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
    .form-grid input:focus, .form-grid textarea:focus { border-color: #b30000; background: #131313; }
    .form-grid textarea { height: 100px; resize: vertical; font-family: inherit; }
    .field-wrap { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 12px; color: #555; letter-spacing: 1px; }
    .field-label em { color: #b30000; font-style: normal; }
    .image-upload-area { border: 2px dashed #252525; border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; }
    .image-upload-area:hover { border-color: #555; background: #111; }
    .image-upload-area.has-image { border-style: solid; border-color: #333; }
    .image-upload-area input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    #upload-preview { width: 100%; max-height: 200px; object-fit: contain; border-radius: 6px; display: none; margin-top: 12px; }
    #upload-filename { font-size: 12px; color: #c9a44c; margin-top: 8px; display: none; }
    #upload-loading { font-size: 13px; color: #c9a44c; display: none; margin-top: 8px; }
    .action-bar { display: flex; gap: 12px; justify-content: flex-end; padding-top: 8px; }
    .btn-cancel { padding: 11px 28px; background: transparent; border: 1px solid #333; color: #888; border-radius: 7px; cursor: pointer; font-size: 14px; text-decoration: none; transition: all 0.2s; }
    .btn-cancel:hover { border-color: #555; color: #f1f1f1; }
    .btn-submit { padding: 11px 36px; background: #b30000; color: #fff; border: none; border-radius: 7px; cursor: pointer; font-size: 14px; letter-spacing: 1px; transition: background 0.2s; }
    .btn-submit:hover { background: #cc0000; }
    .btn-submit:disabled { background: #4a0000; cursor: not-allowed; }
    .msg-box { padding: 12px 18px; border-radius: 7px; font-size: 14px; margin-bottom: 20px; display: none; }
    .msg-success { background: #0a2a0a; border: 1px solid #1a4a1a; color: #4caf50; display: block; }
    .msg-error { background: #2a0a0a; border: 1px solid #4a1a1a; color: #ef5350; display: block; }
  </style>
</head>
<body>

<header class="top-bar">
  <a href="index.html" class="brand" style="text-decoration:none;color:inherit;">ScreamRose</a>
  <nav>
    <a href="guitars.html">Guitars</a>
    <a href="artists.html">Artists</a>
    <a href="support.html">Support</a>
  </nav>
  <div class="cart"><span id="auth-area"></span></div>
</header>

<div class="add-wrap">
  <div class="breadcrumb">
    <a href="admin.html">後台管理</a> › <span>編輯商品</span>
  </div>
  <div class="page-header">
    <h1>✏ 編輯商品</h1>
    <a href="admin.html" class="btn-back">← 返回列表</a>
  </div>

  <div id="msg-box" class="msg-box"></div>

  <div class="form-card">
    <h2>基本資料</h2>
    <div class="form-grid">
      <div class="field-wrap">
        <label class="field-label">商品名稱 <em>*</em></label>
        <input id="f-name" placeholder="例：ScreamRose Les Paul" />
      </div>
      <div class="field-wrap">
        <label class="field-label">價格（NT$）<em>*</em></label>
        <input id="f-price" type="number" placeholder="例：128000" min="0" />
      </div>
      <div class="field-wrap">
        <label class="field-label">系列 <em>*</em></label>
        <input id="f-series" list="series-list" placeholder="選擇或輸入新系列…" autocomplete="off" />
        <datalist id="series-list"></datalist>
      </div>
      <div class="field-wrap">
        <label class="field-label">顏色 <em>*</em></label>
        <input id="f-color" placeholder="例：Heritage Cherry Sunburst" />
      </div>
      <div class="field-wrap">
        <label class="field-label">庫存數量 <em>*</em></label>
        <input id="f-stock" type="number" placeholder="例：5" min="0" />
      </div>
      <div class="field-wrap"></div>
      <div class="field-wrap full">
        <label class="field-label">商品描述</label>
        <textarea id="f-desc" placeholder="輸入商品詳細描述…"></textarea>
      </div>
    </div>
  </div>

  <div class="form-card">
    <h2>商品主圖</h2>
    <div class="image-upload-area" id="upload-area">
      <input type="file" accept="image/*" onchange="handleImageUpload(this)" />
      <div id="upload-placeholder">
        <div style="font-size:32px;margin-bottom:8px;">🖼</div>
        <div style="font-size:13px;color:#555;">點擊更換圖片<br><strong style="color:#888;">支援 JPG、PNG、WebP</strong></div>
      </div>
      <img id="upload-preview" alt="預覽" />
      <div id="upload-filename"></div>
      <div id="upload-loading">⏳ 上傳中…</div>
    </div>
    <input type="hidden" id="f-image" />
  </div>

  <div class="form-card">
    <h2>角度照片</h2>
    <p style="font-size:13px;color:#555;margin:0 0 16px;">可新增或刪除角度照片</p>
    <div id="angle-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px;"></div>
    <label style="display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:#111;border:1px dashed #333;border-radius:7px;cursor:pointer;font-size:13px;color:#888;">
      ＋ 新增角度照片
      <input type="file" accept="image/*" multiple style="display:none" onchange="handleAngleUpload(this)" />
    </label>
    <span id="angle-loading" style="font-size:12px;color:#c9a44c;margin-left:12px;display:none;">⏳ 上傳中…</span>
  </div>

  <div class="form-card">
    <h2>試聽音檔</h2>
    <div id="audio-upload-area" style="border:2px dashed #252525;border-radius:8px;padding:24px;text-align:center;position:relative;cursor:pointer;" onmouseover="this.style.borderColor='#555'" onmouseout="this.style.borderColor='#252525'">
      <input type="file" accept=".mp3,.wav,audio/*" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;" onchange="handleAudioUpload(this)" />
      <div id="audio-placeholder">
        <div style="font-size:32px;margin-bottom:8px;">🎵</div>
        <div style="font-size:13px;color:#555;">點擊更換音檔<br><strong style="color:#888;">支援 MP3、WAV</strong></div>
      </div>
      <div id="audio-result" style="display:none;">
        <audio id="audio-player" controls style="width:100%;margin-bottom:8px;"></audio>
        <div id="audio-filename" style="font-size:12px;color:#c9a44c;"></div>
        <div style="font-size:12px;color:#444;margin-top:6px;">點擊此區域可重新上傳</div>
      </div>
      <div id="audio-loading" style="display:none;font-size:13px;color:#c9a44c;margin-top:8px;">⏳ 上傳中…</div>
    </div>
    <input type="hidden" id="f-audio" />
  </div>

  <div class="action-bar">
    <a href="admin.html" class="btn-cancel">取消</a>
    <button class="btn-submit" id="btn-submit" onclick="saveProduct()">儲存變更</button>
  </div>
</div>

<script src="header.js" defer></script>
<script>
  const token = localStorage.getItem("token");
  const role  = localStorage.getItem("role");
  if (!token || role !== "ADMIN") {
    alert("⚠ 請先以 ADMIN 身份登入！");
    location.href = "login.html";
  }

  const API = "";
  const urlParams = new URLSearchParams(window.location.search);
  const productId = urlParams.get("id");
  let angleImages = [];
  let deletedAngleIds = [];

  // 載入商品資料
  function loadProduct() {
    fetch(API + "/api/products/" + productId)
      .then(r => r.json())
      .then(p => {
        document.getElementById("f-name").value  = p.name;
        document.getElementById("f-price").value = p.price;
        document.getElementById("f-series").value = p.series || "";
        document.getElementById("f-color").value  = p.color  || "";
        document.getElementById("f-stock").value  = p.stock;
        document.getElementById("f-desc").value   = p.description || "";
        document.getElementById("f-image").value  = p.image  || "";
        document.getElementById("f-audio").value  = p.audio  || "";

        // 顯示主圖
        if (p.image) {
          const preview = document.getElementById("upload-preview");
          preview.src = p.image;
          preview.style.display = "block";
          document.getElementById("upload-placeholder").style.display = "none";
          document.getElementById("upload-area").classList.add("has-image");
          const fname = document.getElementById("upload-filename");
          fname.textContent = "✅ 目前圖片";
          fname.style.display = "block";
        }

        // 顯示音檔
        if (p.audio) {
          document.getElementById("f-audio").value = p.audio;
          const player = document.getElementById("audio-player");
          player.src = p.audio;
          document.getElementById("audio-placeholder").style.display = "none";
          document.getElementById("audio-result").style.display = "block";
          document.getElementById("audio-filename").textContent = "✅ 目前音檔";
        }

        // 載入角度照片
        if (p.images && p.images.length > 0) {
          angleImages = p.images.map(img => ({
            id: img.id,
            url: img.imageUrl,
            sortOrder: img.sortOrder
          }));
          renderAngleGrid();
        }
      });
  }

  // 角度照片渲染
  function renderAngleGrid() {
    const grid = document.getElementById("angle-grid");
    grid.innerHTML = angleImages.map((img, index) => `
      <div style="position:relative;border-radius:8px;overflow:hidden;border:1px solid #222;">
        <img src="${img.url}" style="width:100%;height:120px;object-fit:cover;display:block;" />
        <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.7);padding:4px 8px;font-size:11px;color:#aaa;display:flex;justify-content:space-between;align-items:center;">
          <span>第 ${index + 1} 張</span>
          <button onclick="removeAngleImage(${index})" style="background:transparent;border:none;color:#b30000;cursor:pointer;font-size:14px;padding:0;">✕</button>
        </div>
      </div>
    `).join("");
  }

  // 移除角度照片
  function removeAngleImage(index) {
    const img = angleImages[index];
    if (img.id) deletedAngleIds.push(img.id);
    angleImages.splice(index, 1);
    angleImages.forEach((img, i) => img.sortOrder = i);
    renderAngleGrid();
  }

  // 上傳角度照片
  function handleAngleUpload(input) {
    const files = Array.from(input.files);
    if (!files.length) return;
    document.getElementById("angle-loading").style.display = "inline";
    const uploadPromises = files.map(file => {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", "screamrose_upload");
      return fetch("https://api.cloudinary.com/v1_1/dwmyk1ycx/image/upload", {
        method: "POST", body: formData
      })
      .then(r => r.json())
      .then(data => {
        if (data.secure_url) {
          angleImages.push({ url: data.secure_url, sortOrder: angleImages.length });
          renderAngleGrid();
        }
      });
    });
    Promise.all(uploadPromises).then(() => {
      document.getElementById("angle-loading").style.display = "none";
      input.value = "";
    });
  }

  // 上傳主圖
  function handleImageUpload(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const preview = document.getElementById("upload-preview");
      preview.src = e.target.result;
      preview.style.display = "block";
      document.getElementById("upload-placeholder").style.display = "none";
      document.getElementById("upload-area").classList.add("has-image");
    };
    reader.readAsDataURL(file);
    document.getElementById("upload-loading").style.display = "block";
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", "screamrose_upload");
    fetch("https://api.cloudinary.com/v1_1/dwmyk1ycx/image/upload", {
      method: "POST", body: formData
    })
    .then(r => r.json())
    .then(data => {
      document.getElementById("upload-loading").style.display = "none";
      document.getElementById("f-image").value = data.secure_url;
      const fname = document.getElementById("upload-filename");
      fname.textContent = "✅ 上傳成功";
      fname.style.display = "block";
    });
  }

  // 上傳音檔
  function handleAudioUpload(input) {
    const file = input.files[0];
    if (!file) return;
    document.getElementById("audio-loading").style.display = "block";
    document.getElementById("audio-placeholder").style.display = "none";
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", "screamrose_upload");
    fetch("https://api.cloudinary.com/v1_1/dwmyk1ycx/raw/upload", {
      method: "POST", body: formData
    })
    .then(r => r.json())
    .then(data => {
      document.getElementById("audio-loading").style.display = "none";
      document.getElementById("f-audio").value = data.secure_url;
      const player = document.getElementById("audio-player");
      player.src = data.secure_url;
      document.getElementById("audio-filename").textContent = "✅ 上傳成功";
      document.getElementById("audio-result").style.display = "block";
    });
  }

  // 儲存變更
  function saveProduct() {
    const name   = document.getElementById("f-name").value.trim();
    const price  = document.getElementById("f-price").value;
    const series = document.getElementById("f-series").value;
    const color  = document.getElementById("f-color").value.trim();
    const stock  = document.getElementById("f-stock").value;
    const image  = document.getElementById("f-image").value;
    const desc   = document.getElementById("f-desc").value.trim();
    const audio  = document.getElementById("f-audio").value;

    if (!name)  { showMsg("❌ 請輸入商品名稱", "error"); return; }
    if (!price) { showMsg("❌ 請輸入價格", "error"); return; }
    if (!image) { showMsg("❌ 請上傳商品圖片", "error"); return; }

    const btn = document.getElementById("btn-submit");
    btn.disabled = true;
    btn.textContent = "儲存中…";

    // 更新基本資料
    fetch(API + "/api/admin/products/" + productId, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ name, price, series, color, image, stock, description: desc, audio })
    })
    .then(r => r.json())
    .then(() => {
      // 刪除移除的角度照片
      const deletePromises = deletedAngleIds.map(id =>
        fetch(API + "/api/products/images/" + id, {
          method: "DELETE",
          headers: { "Authorization": "Bearer " + token }
        })
      );

      // 新增新的角度照片（沒有 id 的是新上傳的）
      const newAngles = angleImages.filter(img => !img.id);
      const addPromises = newAngles.map(img =>
        fetch(API + "/api/products/" + productId + "/images", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ imageUrl: img.url, sortOrder: img.sortOrder })
        })
      );

      return Promise.all([...deletePromises, ...addPromises]);
    })
    .then(() => {
      showMsg("✅ 商品更新成功！3 秒後返回列表…", "success");
      btn.textContent = "已儲存";
      setTimeout(() => { location.href = "admin.html"; }, 3000);
    })
    .catch(err => {
      showMsg("❌ 儲存失敗：" + err, "error");
      btn.disabled = false;
      btn.textContent = "儲存變更";
    });
  }

  function showMsg(text, type) {
    const box = document.getElementById("msg-box");
    box.textContent = text;
    box.className = "msg-box msg-" + type;
    box.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  function loadSeriesOptions() {
    fetch(API + "/api/products/series")
      .then(r => r.json())
      .then(list => {
        const datalist = document.getElementById("series-list");
        list.forEach(series => {
          const opt = document.createElement("option");
          opt.value = series;
          datalist.appendChild(opt);
        });
      });
  }

  loadProduct();
  loadSeriesOptions();
</script>
</body>
</html>
