<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScreamRose | Guitars</title>
  <link rel="stylesheet" href="style.css">
  <script src="header.js" defer></script>
  <style>
    .guitars-hero {
      text-align: center;
      padding: 80px 40px 60px;
      border-bottom: 1px solid #1a1a1a;
    }
    .guitars-hero h1 {
      font-size: 48px;
      letter-spacing: 4px;
      margin: 0 0 12px;
    }
    .guitars-hero p {
      color: #666;
      font-size: 16px;
      margin: 0;
    }

    /* 篩選列 */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 40px 40px 0;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 8px 20px;
      background: transparent;
      border: 1px solid #333;
      color: #aaa;
      border-radius: 99px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover { border-color: #666; color: #fff; }
    .filter-btn.active {
      background: #b30000;
      border-color: #b30000;
      color: #fff;
    }

    /* 商品列表 */
    .guitars-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      max-width: 1300px;
      margin: 40px auto;
      padding: 0 40px;
    }

    .guitar-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
      text-decoration: none;
      display: block;
    }
    .guitar-card:hover {
      border-color: #444;
      transform: translateY(-4px);
    }
    .guitar-card-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      transition: transform 0.3s;
    }
    .guitar-card:hover .guitar-card-img {
      transform: scale(1.03);
    }
    .guitar-card-body {
      padding: 20px;
    }
    .guitar-card-series {
      font-size: 12px;
      color: #555;
      letter-spacing: 1px;
      margin: 0 0 6px;
    }
    .guitar-card-name {
      font-size: 18px;
      font-weight: 500;
      color: #f1f1f1;
      margin: 0 0 4px;
    }
    .guitar-card-color {
      font-size: 14px;
      color: #777;
      margin: 0 0 16px;
    }
    .guitar-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .guitar-card-price {
      font-size: 18px;
      color: #ff4d4d;
    }
    .guitar-card-btn {
      font-size: 13px;
      color: #c9a44c;
      border: 1px solid #c9a44c;
      padding: 6px 14px;
      border-radius: 4px;
      transition: background 0.2s, color 0.2s;
    }
    .guitar-card:hover .guitar-card-btn {
      background: #c9a44c;
      color: #000;
    }

    /* 結果數量 */
    .result-count {
      text-align: center;
      color: #555;
      font-size: 14px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<header class="top-bar">
  <a href="index.html" class="brand" style="text-decoration:none; color:inherit;">ScreamRose</a>
  <nav>
    <a href="guitars.html" style="color:#fff;">Guitars</a>
    <a href="artists.html">Artists</a>
    <a href="support.html">Support</a>
  </nav>
  <div class="cart">
    <span id="auth-area"></span>
    &nbsp;&nbsp;🛒 <span id="cart-count">0</span>
  </div>
</header>

<!-- Hero -->
<div class="guitars-hero">
  <h1>GUITARS</h1>
  <p>Vintage Collection — 經典重現，現代工藝</p>
</div>

<!-- 篩選列 -->
<div class="filter-bar" id="filter-bar"></div>
	

<p class="result-count" id="result-count">共 4 款</p>

<!-- 商品列表 -->
<div class="guitars-grid" id="guitars-grid"></div>

<footer class="footer">
  © 2026 ScreamRose Guitars. All Rights Reserved.
</footer>

<script>
  fetch("/api/products")
    .then(res => res.json())
	.then(products => {
	  renderFilters(products);
	  renderGuitars(products);
	  setupFilters(products);
	});

	function renderFilters(products) {
	  const prices = [...new Set(products.map(p => Number(p.price)))].sort((a, b) => a - b);
	  const bar = document.getElementById("filter-bar");
	  bar.innerHTML = `<button class="filter-btn active" data-price="all">全部</button>` +
	    prices.map(p => `<button class="filter-btn" data-price="${p}">NT$ ${p.toLocaleString()}</button>`).join("");
	}
	
  function renderGuitars(list) {
    const grid = document.getElementById("guitars-grid");
    document.getElementById("result-count").textContent = "共 " + list.length + " 款";

    if (list.length === 0) {
      grid.innerHTML = `<p style="color:#555; grid-column:1/-1; text-align:center; padding:60px 0;">沒有符合條件的商品</p>`;
      return;
    }

    grid.innerHTML = list.map(p => `
      <a class="guitar-card" href="product.html?id=${p.id}">
        <img class="guitar-card-img" src="${p.image}" alt="${p.color}">
        <div class="guitar-card-body">
          <p class="guitar-card-series">${(p.series || "").toUpperCase()}</p>
          <p class="guitar-card-name">${p.name}</p>
          <p class="guitar-card-color">${p.color || ""}</p>
          <div class="guitar-card-footer">
            <span class="guitar-card-price">NT$ ${Number(p.price).toLocaleString()}</span>
            <span class="guitar-card-btn">查看詳細</span>
          </div>
        </div>
      </a>
    `).join("");
  }

  function setupFilters(allProducts) {
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        this.classList.add("active");
        const price = this.dataset.price;
        const filtered = price === "all"
          ? allProducts
          : allProducts.filter(p => Number(p.price) === parseInt(price));
        renderGuitars(filtered);
      });
    });
  }
</script>
</body>
</html>
